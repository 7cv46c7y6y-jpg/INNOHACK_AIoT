<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}아쿠아클레임{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230b2545%22/%3E%3Ctext x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22%235fd3c6%22%3E%E2%89%8B%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}">
      <span class="brand-mark" aria-hidden="true">≋</span> 아쿠아클레임
    </a>
    <nav class="topnav">
      <a href="{{ url_for('main.index') }}" class="{% if request.endpoint == 'main.index' %}active{% endif %}">서류 작성</a>
      <a href="{{ url_for('main.map_page') }}" class="{% if request.endpoint == 'main.map_page' %}active{% endif %}">피해 지도</a>
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    시연용 서비스입니다. 실제 개인정보를 넣지 마세요. 만든 서류는 서명 전 초안이며, 공적 확인과 제출은 직접 하셔야 합니다.
  </footer>
  <script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
