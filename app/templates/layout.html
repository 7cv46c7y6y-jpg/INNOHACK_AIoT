<!doctype html>
<html lang="ko" class="light-style layout-menu-fixed" dir="ltr" data-theme="theme-default"
      data-assets-path="{{ url_for('static', filename='vendor/sneat/') }}" data-template="vertical-menu-template-free">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}아쿠아클레임{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23696cff%22/%3E%3Ctext x=%2250%22 y=%2270%22 font-size=%2262%22 text-anchor=%22middle%22 fill=%22white%22%3E%E2%89%8B%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/sneat/fonts/boxicons.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/sneat/css/core.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/sneat/css/theme-default.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/sneat/libs/perfect-scrollbar/perfect-scrollbar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
  <script src="{{ url_for('static', filename='vendor/sneat/js/helpers.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/sneat/js/config.js') }}"></script>
</head>
<body>
<div class="layout-wrapper layout-content-navbar">
  <div class="layout-container">

    <!-- 왼쪽 메뉴 -->
    <aside id="layout-menu" class="layout-menu menu-vertical menu bg-menu-theme">
      <div class="app-brand demo">
        <a href="{{ url_for('main.home') }}" class="app-brand-link">
          <span class="brand-mark"><i class="bx bx-water"></i></span>
          <span class="app-brand-text demo menu-text fw-bolder ms-2">아쿠아클레임</span>
        </a>
        <a href="javascript:void(0);" class="layout-menu-toggle menu-link text-large ms-auto d-block d-xl-none">
          <i class="bx bx-chevron-left bx-sm align-middle"></i>
        </a>
      </div>
      <div class="menu-inner-shadow"></div>
      <ul class="menu-inner py-1">
        <li class="menu-item {% if request.endpoint == 'main.home' %}active{% endif %}">
          <a href="{{ url_for('main.home') }}" class="menu-link">
            <i class="menu-icon tf-icons bx bx-home-circle"></i><div>홈</div>
          </a>
        </li>
        <li class="menu-header small text-uppercase"><span class="menu-header-text">피해 신고</span></li>
        <li class="menu-item {% if request.endpoint == 'main.apply' %}active{% endif %}">
          <a href="{{ url_for('main.apply') }}" class="menu-link">
            <i class="menu-icon tf-icons bx bx-file"></i><div>피해보상 서류 작성</div>
          </a>
        </li>
        <li class="menu-item {% if request.endpoint == 'main.map_page' %}active{% endif %}">
          <a href="{{ url_for('main.map_page') }}" class="menu-link">
            <i class="menu-icon tf-icons bx bx-map-alt"></i><div>피해 지도</div>
          </a>
        </li>
      </ul>
    </aside>

    <div class="layout-page">
      <div class="content-wrapper">
        <div class="container-xxl flex-grow-1 container-p-y">
          <!-- 휴대폰·태블릿 화면에서는 왼쪽 메뉴가 숨으므로 여는 버튼만 둔다 -->
          <button type="button" class="btn btn-sm btn-outline-secondary layout-menu-toggle d-xl-none mb-3" aria-label="메뉴 열기">
            <i class="bx bx-menu me-1"></i>메뉴
          </button>
          {% block content %}{% endblock %}
        </div>
        <footer class="content-footer footer bg-footer-theme">
          <div class="container-xxl d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column small">
            <div class="mb-2 mb-md-0">시연용 서비스입니다. 실제 개인정보를 넣지 마세요. 만든 서류는 서명 전 초안이며, 공적 확인과 제출은 직접 하셔야 합니다.</div>
            <div class="text-muted">화면 디자인: Sneat (MIT, ThemeSelection) · 지도: © OpenStreetMap</div>
          </div>
        </footer>
        <div class="content-backdrop fade"></div>
      </div>
    </div>
  </div>
  <div class="layout-overlay layout-menu-toggle"></div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 2000">
  <div id="toast" class="bs-toast toast fade bg-primary" role="status" aria-live="polite" data-bs-delay="3200">
    <div class="toast-body" id="toast-body"></div>
  </div>
</div>

<script src="{{ url_for('static', filename='vendor/sneat/libs/jquery/jquery.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/sneat/libs/popper/popper.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/sneat/js/bootstrap.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/sneat/libs/perfect-scrollbar/perfect-scrollbar.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/sneat/js/menu.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/sneat/js/main.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
